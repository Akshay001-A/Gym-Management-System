
spring:
  application:
    name: member-service

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

  datasource:
    url: ${MEMBER_DB_URL:jdbc:postgresql://localhost:5432/gym_member_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:}
  internal-service:
    key: ${INTERNAL_SERVICE_KEY:}
  attendance:
    qr-token-ttl-seconds: ${ATTENDANCE_QR_TOKEN_TTL_SECONDS:90}
    scan-cooldown-seconds: ${ATTENDANCE_SCAN_COOLDOWN_SECONDS:5}
    time-zone: ${ATTENDANCE_TIME_ZONE:Asia/Kolkata}
  mail:
    from: ${MAIL_FROM:}
