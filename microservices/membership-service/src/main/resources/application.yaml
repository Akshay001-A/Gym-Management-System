
spring:
  application:
    name: membership-service

  datasource:
    url: ${MEMBERSHIP_DB_URL:jdbc:postgresql://localhost:5432/gym_membership_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

services:
  member-service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"

app:
  internal-service:
    key: ${INTERNAL_SERVICE_KEY:}
