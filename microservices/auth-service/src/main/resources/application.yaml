
spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/gym_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

  member-service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8081}

  admin-setup:
    enabled: ${ADMIN_SETUP_ENABLED:false}
    secret: ${ADMIN_SETUP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
