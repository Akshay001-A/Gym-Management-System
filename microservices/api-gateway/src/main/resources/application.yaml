
spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: member-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/members/**

            - id: membership-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/memberships/**

            - id: trainer-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/trainers/**

server:
  port: 8083
