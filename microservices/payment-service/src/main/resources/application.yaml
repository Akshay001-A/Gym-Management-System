app:
  jwt:
    secret: ${JWT_SECRET}
  member-service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8081}
  internal-service:
    key: ${INTERNAL_SERVICE_KEY:}

membership:
  service:
    url: ${MEMBERSHIP_SERVICE_URL:http://localhost:8082}
  internal-service:
    key: ${INTERNAL_SERVICE_KEY:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/gym_payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
